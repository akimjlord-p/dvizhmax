# Webhook behind Caddy, which obtains and renews the HTTPS certificate by itself.
#   docker compose -f docker-compose.yml -f docker-compose.webhook.yml up -d --build
# Needs DOMAIN in .env, a DNS A record of DOMAIN
# pointing to the server, and free ports 80 and 443.
services:
  bot:
    environment:
      MAX_TRANSPORT: webhook
      MAX_WEBHOOK_URL: https://${DOMAIN:?Set DOMAIN in .env}${MAX_WEBHOOK_PATH:-/max/webhook}
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN}
      MAX_WEBHOOK_PATH: ${MAX_WEBHOOK_PATH:-/max/webhook}
      MAX_WEBHOOK_PORT: ${MAX_WEBHOOK_PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
