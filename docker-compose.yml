# `docker compose up -d --build` starts everything: PostgreSQL, Redis, migrations,
# the bot and the catalog worker. Settings come from .env (see .env.example).

x-app: &app
  # One image for every app process. Only the bot builds it: parallel builds of
  # one tag conflict, so the other services never build or pull it.
  image: dvizhmax-app:${IMAGE_TAG:-latest}
  pull_policy: never
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://dvizhmax:${POSTGRES_PASSWORD:-dvizhmax}@postgres:5432/dvizhmax
    REDIS_URL: redis://redis:6379/0

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dvizhmax
      POSTGRES_USER: dvizhmax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dvizhmax}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvizhmax -d dvizhmax"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app
    build: .
    pull_policy: build
    command: ["python", "-m", "bot.main"]
    # Webhook port for a reverse proxy on the same host; unused in long polling.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: *after-migrate
      redis:
        condition: service_healthy
    restart: unless-stopped

  catalog-worker:
    <<: *app
    command: ["python", "-m", "workers.catalog_worker"]
    depends_on: *after-migrate
    restart: unless-stopped

  # Maintenance commands: docker compose run --rm <name>
  demo-reset:
    <<: *app
    command: ["python", "-m", "workers.reset_demo"]
    depends_on: *after-migrate
    profiles: ["tools"]
    restart: "no"

  profile-reset:
    <<: *app
    command: ["python", "-m", "workers.reset_profiles"]
    depends_on: *after-migrate
    profiles: ["tools"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
