# Base stack. `docker compose up -d --build` builds the app image once, applies
# migrations and (re)starts the bot and the catalog worker.
# Delivery mode is chosen by .env (MAX_TRANSPORT) or an override file:
#   docker-compose.polling.yml — long polling, no domain needed
#   docker-compose.webhook.yml — webhook behind Caddy with automatic HTTPS
# Without an override the bot publishes 127.0.0.1:8080 for nginx on the host.

# Every app service runs the same image. Only the bot builds it: several builds of
# one tag in parallel conflict. The others never pull it from a registry.
x-app: &app
  image: dvizhmax-app:${IMAGE_TAG:-latest}
  pull_policy: never
  env_file: .env

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dvizhmax
      POSTGRES_USER: dvizhmax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvizhmax -d dvizhmax"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app
    build: .
    pull_policy: build
    command: ["python", "-m", "bot.main"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: *after-migrate
      redis:
        condition: service_healthy
    restart: unless-stopped

  catalog-worker:
    <<: *app
    command: ["python", "-m", "workers.catalog_worker"]
    depends_on: *after-migrate
    restart: unless-stopped

  demo-seed:
    <<: *app
    command: ["python", "-m", "workers.demo_seed"]
    depends_on: *after-migrate
    profiles: ["tools"]
    restart: "no"

  demo-reset:
    <<: *app
    command: ["python", "-m", "workers.reset_demo"]
    depends_on: *after-migrate
    profiles: ["tools"]
    restart: "no"

  profile-reset:
    <<: *app
    command: ["python", "-m", "workers.reset_profiles"]
    depends_on: *after-migrate
    profiles: ["tools"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
