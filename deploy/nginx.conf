# nginx site for the webhook: proxies https://YOUR_DOMAIN/max/webhook to the bot
# container on 127.0.0.1:8080. Setup steps are in README, "Деплой на сервер".
# If the domain already has a site, add only the "location = /max/webhook" block to it.

server {
    listen 80;
    server_name bot.example.com;

    location = /max/webhook {
        proxy_pass http://127.0.0.1:8080/max/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
