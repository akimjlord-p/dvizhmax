# nginx on the host (current production setup): the bot container publishes
# 127.0.0.1:8080 and this site proxies MAX webhook requests to it.
#
#   sudo cp deploy/host-nginx/dvizhmax.conf /etc/nginx/sites-available/dvizhmax.conf
#   sudo sed -i 's/bot.example.com/YOUR_DOMAIN/g' /etc/nginx/sites-available/dvizhmax.conf
#   sudo ln -s /etc/nginx/sites-available/dvizhmax.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN     # adds the TLS lines and the HTTP→HTTPS redirect
#
# If the domain already has a site, add only the "location = /max/webhook" block to it.

server {
    listen 80;
    server_name bot.example.com;

    location = /max/webhook {
        proxy_pass http://127.0.0.1:8080/max/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
